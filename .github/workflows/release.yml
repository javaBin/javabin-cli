name: Release

# Every push to main that contains a feat/fix/perf (or breaking) commit is
# released: the next version is computed from Conventional Commits since the
# last tag (scripts/next-version.sh), tagged, and published by GoReleaser to
# GitHub Releases and the javaBin/homebrew-tap formula, so `brew upgrade
# javabin` and `go install ...@latest` pick it up. A pushed v* tag releases
# that tag as before.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go vet ./... && go test ./...

      - name: Decide version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A re-run after a failed publish: HEAD is already tagged
          EXISTING=$(git tag --points-at HEAD 'v*' | head -1)
          if [ -n "$EXISTING" ]; then
            echo "tag=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(sh scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
          fi

      # Tag pushes made with GITHUB_TOKEN don't start workflows, so the
      # release runs in this same job rather than on the new tag.
      - name: Tag release
        if: steps.version.outputs.tag != '' && steps.version.outputs.existing != 'true' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - uses: actions/create-github-app-token@v1
        if: steps.version.outputs.tag != '' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        id: app-token
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: javaBin
          repositories: homebrew-tap

      - uses: goreleaser/goreleaser-action@v6
        if: steps.version.outputs.tag != '' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Nothing to release
        if: steps.version.outputs.tag == ''
        run: echo "No feat/fix/perf commits since the last tag — no release."
